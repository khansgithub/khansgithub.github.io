###########
# site.title

title: khans blog
sub_title:
  - rockstar ninja developer
  - mediore alright code writer
description: blog of a mediore alright code writing person
# baseurl: "/jekyllBear" # the subpath of your site, e.g. /blog/
url: "https://khansgithub.github.io/" # the base hostname & protocol for your site
# host: 0.0.0.0


#########################
# more settings

plugins:
  - jekyll-redirect-from

whitelist:
  - jekyll-redirect-from

markdown: kramdown

compress_html:
  clippings: all
  comments: [""]
  endings: [html, head, body, li, dt, dd, rt, rp, optgroup, option, colgroup, caption, thead, tbody, tfoot, tr, td, th]
  profile: false
  blanklines: false
  ignore:
    envs: []

# sass:
#   sass_dir: css
#   style:    compressed

collections:
  my_tags:
    output: true
    permalink: /tagged/:slug/
defaults:
  -
    scope:
      path: ""
      type: my_tags
    values:
      layout: tagged

# baseurl: ""
permalink: /blog/:slug
timezone: Europe/London
future: false

exclude:
- README.md
- LICENSE.md
- _exclude/

exclude: [vendor]

Blog: /blog
Misc: /misc

# Add general links to site pages here
links:
  # Resume: /assets/resume.pdf
  

# Add links for more focus here
special_links:
  # "Search": https://duckduckgo.com